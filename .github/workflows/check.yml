# 변경 검증 — 깨진 코드가 운영(GitHub Pages)에 올라가는 것을 막는다.
# GitHub Pages 는 main 에 올라가는 즉시 배포되므로, 최소한 문법은 자동으로 확인한다.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Worker 문법 검사
        run: |
          cp cloudflare-worker.js /tmp/worker-check.mjs
          node --check /tmp/worker-check.mjs

      - name: 대시보드 인라인 스크립트 문법 검사
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const js = [...html.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)]
              .map(m => m[1]).join('\n');
            try { new Function(js); console.log('✅ index.html 문법 OK'); }
            catch (e) { console.error('❌ index.html 문법 오류:', e.message); process.exit(1); }
          "

      - name: 판정 규칙 중복 구현 감지
        # 가용 판정은 서버(cloudflare-worker.js)가 단일 기준이어야 한다.
        # 과거 두 파일에 같은 규칙이 따로 있어 목록이 서로 달라진 적이 있다.
        run: |
          node -e "
            const fs = require('fs');
            const w = fs.readFileSync('cloudflare-worker.js', 'utf8');
            const h = fs.readFileSync('index.html', 'utf8');
            const re = /const OUT_KEYWORDS\s*=\s*(\[[^\]]*\])/;
            const a = (w.match(re) || [])[1], b = (h.match(re) || [])[1];
            if (a && b && a.replace(/\s/g,'') !== b.replace(/\s/g,'')) {
              console.error('❌ OUT_KEYWORDS 가 서버와 화면에서 다릅니다. 두 곳을 맞추세요.');
              console.error('   worker:', a); console.error('   index :', b);
              process.exit(1);
            }
            console.log('✅ 공통 상수 일치');
          "
