# 변경 검증 — 깨진 코드가 운영(GitHub Pages)에 올라가는 것을 막는다.
# GitHub Pages 는 main 에 올라가는 즉시 배포되므로, 최소한 문법은 자동으로 확인한다.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Worker 문법 검사
        run: |
          cp cloudflare-worker.js /tmp/worker-check.mjs
          node --check /tmp/worker-check.mjs

      - name: 대시보드 인라인 스크립트 문법 검사
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const js = [...html.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)]
              .map(m => m[1]).join('\n');
            try { new Function(js); console.log('✅ index.html 문법 OK'); }
            catch (e) { console.error('❌ index.html 문법 오류:', e.message); process.exit(1); }
          "

      - name: 판정 규칙 중복 구현 감지
        # 가용 판정은 서버(cloudflare-worker.js)가 단일 기준이어야 한다.
        # 과거 두 파일에 같은 규칙이 따로 있어 목록이 서로 달라진 적이 있다.
        # (정규식의 역슬래시가 셸 따옴표에서 깨지지 않도록 별도 스크립트로 분리)
        run: node .github/scripts/check-constants.cjs

      - name: 회귀 테스트 (테스트/*.mjs)
        # 의존성 없이 Node 만으로 돈다. 하나라도 실패하면 막는다.
        run: |
          for t in 테스트/*.mjs; do
            echo "── $t"
            node "$t" || exit 1
          done
