# 변경 검증 — 깨진 코드가 운영(GitHub Pages)에 올라가는 것을 막는다.
# GitHub Pages 는 main 에 올라가는 즉시 배포되므로, 최소한 문법은 자동으로 확인한다.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Worker 문법 검사
        run: |
          cp cloudflare-worker.js /tmp/worker-check.mjs
          node --check /tmp/worker-check.mjs

      - name: 대시보드 인라인 스크립트 문법 검사
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const js = [...html.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)]
              .map(m => m[1]).join('\n');
            try { new Function(js); console.log('✅ index.html 문법 OK'); }
            catch (e) { console.error('❌ index.html 문법 오류:', e.message); process.exit(1); }
          "

      - name: 판정 규칙 중복 구현 감지
        # 가용 판정은 서버(cloudflare-worker.js)가 단일 기준이어야 한다.
        # 과거 두 파일에 같은 규칙이 따로 있어 목록이 서로 달라진 적이 있다.
        run: |
          node -e "
            const fs = require('fs');
            const w = fs.readFileSync('cloudflare-worker.js', 'utf8');
            const h = fs.readFileSync('index.html', 'utf8');
            // 서버의 '판정용' 목록과 화면 폴백 목록을 비교한다.
            // (서버의 OUT_KEYWORDS 는 색상 분류용이라 판정과 무관 — 판정용은 AVAIL_OUT_KEYWORDS)
            const get = (src, name) => {
              const m = src.match(new RegExp('const ' + name + '\\s*=\\s*(\\[[^\\]]*\\])'));
              return m ? m[1].replace(/\s/g, '') : null;
            };
            const pairs = [
              ['AVAIL_OUT_KEYWORDS', 'OUT_KEYWORDS'],         // 부재 키워드
              ['AVAILABLE_KEYWORDS', 'AVAILABLE_KEYWORDS'],   // 가능 키워드
            ];
            let bad = false;
            for (const [wn, hn] of pairs) {
              const a = get(w, wn), b = get(h, hn);
              if (!a || !b) { console.error('❌ 상수를 찾지 못함:', !a ? 'worker ' + wn : 'index ' + hn); bad = true; continue; }
              if (a !== b) {
                console.error('❌ 서버 ' + wn + ' 와 화면 ' + hn + ' 가 다릅니다. 두 곳을 맞추세요.');
                console.error('   worker:', a); console.error('   index :', b); bad = true;
              }
            }
            if (bad) process.exit(1);
            console.log('✅ 판정 상수 일치 (부재·가능 키워드)');
          "
