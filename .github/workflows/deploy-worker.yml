# Cloudflare Worker 자동 배포
#
# 동작: 수동 실행 전용 (2026-10-26 운영자 결정 — GitHub Secrets 연동은 하지 않음).
#       평소 배포는 프로젝트 폴더의 '배포하기.bat' 더블클릭.
#       자동 배포를 켜려면 아래 Secrets 를 등록한 뒤 on: 에 push 트리거를 되살릴 것.
#
# ⚠️ 사전 설정 (1회):
#   GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret
#     CLOUDFLARE_API_TOKEN : Cloudflare 대시보드 → My Profile → API Tokens →
#                            "Edit Cloudflare Workers" 템플릿으로 생성
#     CLOUDFLARE_ACCOUNT_ID: 432a7fd8cfc5ec28c1ea7fdf035c47f3
#
# ⚠️ --keep-vars 는 반드시 유지할 것.
#    wrangler.toml 에 활성 [vars] 블록이 없으므로, 이 옵션 없이 배포하면
#    대시보드에 등록된 환경변수가 전부 삭제되고 자동 동기화가 조용히 멈춘다.

name: Deploy Worker

on:
  workflow_dispatch:   # 수동 실행만 (Secrets 미등록 상태에서 push 마다 실패 표시가 뜨지 않도록)

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 문법 검사
        run: |
          cp cloudflare-worker.js /tmp/worker-check.mjs
          node --check /tmp/worker-check.mjs

      - name: Cloudflare 배포
        run: npx --yes wrangler@4 deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
